# Общие настройки для всех сервисов, которые берут конфиг из config-server.
# Настройки конкретного сервиса — в файле <имя-сервиса>.yml рядом.
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.example: INFO

# База общая для всех сервисов, таблицы создаёт Hibernate по сущностям.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/uspeh_db}
    username: ${DB_USERNAME:student_app}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
