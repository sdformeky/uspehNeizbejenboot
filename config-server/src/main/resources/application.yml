server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # папка config-repo в корне проекта; ../ — если запускать из папки модуля
          search-locations: file:./config-repo/,file:../config-repo/

management:
  endpoints:
    web:
      exposure:
        include: health,info
