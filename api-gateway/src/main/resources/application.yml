server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # lb:// — адрес сервиса берётся из Eureka по имени
            - id: student-service
              uri: lb://student-service
              predicates:
                - Path=/students/**
