server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: student-service
              uri: lb://student-service
              predicates:
                - Path=/students/**
            - id: course-service
              uri: lb://course-service
              predicates:
                - Path=/courses/**
            - id: enrollment-service
              uri: lb://enrollment-service
              predicates:
                - Path=/enrollments/**
            - id: certificate-service
              uri: lb://certificate-service
              predicates:
                - Path=/certificates/**
      routes:
        - id: certificate-service
          uri: lb://certificate-service
          predicates:
            - Path=/api/certificates/**
