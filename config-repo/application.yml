# Общие настройки для всех сервисов, которые берут конфиг из config-server.
# Настройки конкретного сервиса — в файле <имя-сервиса>.yml рядом.
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

# /actuator/info: название и описание — в файле сервиса, версия общая (как в pom.xml)
info:
  app:
    version: 0.0.1-SNAPSHOT

# Единый формат логов для всех сервисов: время, уровень, сервис, поток, класс, сообщение.
# Пишется и в консоль, и в файл logs/<имя-сервиса>.log
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [${spring.application.name}] [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [${spring.application.name}] [%thread] %logger{36} - %msg%n"
  file:
    name: logs/${spring.application.name}.log
  level:
    root: INFO
    org.example: INFO

# Учитывать заголовки X-Forwarded-*, которые ставит api-gateway:
# тогда Swagger сервиса показывает адрес gateway, а не свой порт
server:
  forward-headers-strategy: framework

# База общая для всех сервисов, таблицы создаёт Hibernate по сущностям.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/uspeh_db}
    username: ${DB_USERNAME:student_app}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
