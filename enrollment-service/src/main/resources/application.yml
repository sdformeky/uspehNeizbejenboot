server:
  port: 8083

spring:
  application:
    name: enrollment-service
  config:
    import: "optional:configserver:http://localhost:8888"
  datasource:
    url: jdbc:postgresql://localhost:5432/uspeh_db
    username: student_app
    password: IuFTwzVlmPoyrYiqHCs8
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

feign:
  circuitbreaker:
    enabled: true # Активируем интеграцию Feign и Circuit Breaker

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers # Добавили circuitbreakers
  endpoint:
    health:
      show-details: always # Позволяет видеть статус CB внутри общего /actuator/health

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true # Регистрирует статус CB в health-check
        # Наши старые настройки порогов:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50.0
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 15000ms
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
