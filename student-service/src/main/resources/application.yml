server:
  port: 8081

spring:
  application:
    name: student-service
  config:
    import: optional:configserver:http://localhost:8888
  # тестовые данные из data.sql — после того, как Hibernate создаст таблицы
  sql:
    init:
      mode: always
      encoding: UTF-8
  jpa:
    defer-datasource-initialization: true
