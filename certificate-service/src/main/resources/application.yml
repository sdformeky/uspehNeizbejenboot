server:
  port: 8084

spring:
  application:
    name: certificate-service
  config:
    import: optional:configserver:http://localhost:8888
  # шаблон сертификата из data.sql — после того, как Hibernate создаст таблицы
  sql:
    init:
      mode: always
      encoding: UTF-8
  jpa:
    defer-datasource-initialization: true
